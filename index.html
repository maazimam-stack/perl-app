<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co http://127.0.0.1:8765 http://localhost:8765; worker-src 'self' blob:; manifest-src 'self'; base-uri 'none'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perl</title>
<meta name="description" content="Clerkship debriefs and CI MED school deadlines, in one private app.">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Perl">
<script src="boot.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="app/styles.css">
<link rel="stylesheet" href="shim.css">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Navigation"></aside>
  <main class="canvas">
    <div class="topbar">
      <span class="tb-name" id="tb-name">Perl</span>
      <button class="tb-search" data-act="palette" aria-label="Search or ask"><svg viewBox="0 0 18 18" aria-hidden="true"><circle cx="8" cy="8" r="5"/><path d="M12 12l3.5 3.5"/></svg></button>
      <button id="menu-btn" aria-label="Open menu" aria-haspopup="dialog">Menu</button>
    </div>
    <div id="subnav"></div>
    <div class="view" id="view"><noscript>This tool needs JavaScript turned on.</noscript></div>
    <div class="dbf dbf-host" id="dbf-views" hidden></div>
  </main>
</div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Menu" data-open="false"></div>
<div class="scrim" id="scrim" data-open="false"></div>
<aside class="drawer t-panel-slide" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-title" data-open="false"></aside>
<div class="pal-wrap" id="pal" data-open="false">
  <div class="pal-scrim" data-act="palette-close"></div>
  <div class="pal t-modal" role="dialog" aria-modal="true" aria-label="Search and commands">
    <div class="pal-in"><svg viewBox="0 0 18 18" aria-hidden="true"><circle cx="8" cy="8" r="5"/><path d="M12 12l3.5 3.5"/></svg><label class="sr" for="pal-q">Search policies, dates and pages, or ask a question</label><input id="pal-q" type="text" role="combobox" aria-expanded="true" aria-controls="pal-res" autocomplete="off" spellcheck="false" placeholder="Search policies, dates and pages, or ask a question"><kbd>Esc</kbd></div>
    <div class="pal-res" id="pal-res" role="listbox" aria-label="Results"></div>
    <div class="pal-foot"><span>↑ ↓ to move</span><span>Enter to open</span><span>Ask in plain words, like “can I miss a shelf exam?”</span></div>
  </div>
</div>
<div class="toast-wrap" aria-live="polite"><div class="t-toast toast" id="toast" role="status"></div></div>
<!-- Debrief space: Perl views live beside #view; overlays sit at the end of the page. -->
<template id="dbf-views-tpl">
      
      <section class="view" id="view-calendar" aria-label="Calendar" hidden></section>
      <section class="view" id="view-journal" aria-label="Journal" hidden>
        <div class="vh"><div><div class="eyebrow">Everything you've logged, private to you</div><h1>Journal</h1></div></div>
        <div id="jstrip"></div>
        <div class="jtools">
          <label class="search"><i data-icon="search" data-cls="sm"></i><span class="sr">Search entries</span><input class="input" id="q" type="search" placeholder="Search titles, notes, people, themes"></label>
          <div class="chiprow" id="frot"></div>
          <div class="chiprow" id="fcomp"></div>
        </div>
        <div id="jlist"></div>
      </section>
      <section class="view" id="view-vault" aria-label="Residency vault" hidden></section>
      <section class="view" id="view-mspe" aria-label="MSPE builder" hidden></section>
      <section class="view" id="view-toolkit" aria-label="Toolkit" hidden></section>
    </template>
<div class="dbf" id="dbf-ov">
<button class="fab" type="button" data-act="new" aria-label="New debrief"><i data-icon="plus" data-cls="lg"></i></button>

<div class="overlay" id="composer" hidden>
  <div class="scrim" data-close="composer"></div>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="composeTitle">
    <header class="sheet-h">
      <h2 id="composeTitle">New debrief</h2>
      <div class="sheet-meta" id="composeMeta"></div>
      <button class="iconbtn" type="button" data-close="composer" aria-label="Close"><i data-icon="x"></i></button>
    </header>
    <div class="sheet-b" id="composeWrite">
      <div class="pad">
        <div class="pad-top">
          <button class="dictate" id="dictateBtn" type="button" aria-describedby="hint"><i data-icon="mic" data-cls="sm"></i>Dictate</button>
          <span class="hint" id="hint"></span>
        </div>
        <label for="pad" class="sr">Debrief note</label>
        <textarea id="pad" spellcheck="true" placeholder="Talk it out. What did you do, what did you learn, and what did anyone say about your work? Skip names, dates and room numbers."></textarea>
        <div class="pad-foot">
          <canvas id="ecg" aria-hidden="true"></canvas>
          <span class="wc" id="wc">0 words</span>
          <button class="linkbtn" id="clearBtn" type="button">Clear</button>
        </div>
      </div>
      <div class="chiprow" id="starters"></div>
      <div id="phi" aria-live="polite"></div>
      <div id="energyBox"></div>
    </div>
    <div class="sheet-b" id="composeReview" hidden></div>
    <div class="sheet-b" id="composeDone" hidden aria-live="polite"></div>
    <footer class="sheet-f" id="composeFoot"></footer>
  </section>
</div>

<div class="overlay" id="entry" hidden>
  <div class="scrim" data-close="entry"></div>
  <aside class="panel" role="dialog" aria-modal="true" aria-label="Entry" id="entryPanel"></aside>
</div>

<div class="overlay" id="palette" hidden>
  <div class="scrim" data-close="palette"></div>
  <div class="pal" role="dialog" aria-modal="true" aria-label="Command menu">
    <div class="pal-in"><i data-icon="search"></i><input id="palQ" type="text" placeholder="Search entries or jump to…" aria-label="Search" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="palList"><kbd>esc</kbd></div>
    <ul id="palList" role="listbox"></ul>
  </div>
</div>
<input type="file" id="schedFile" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
<div class="overlay" id="importer" hidden>
  <div class="scrim" data-close="importer"></div>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="impTitle">
    <header class="sheet-h"><h2 id="impTitle">Import schedule</h2><button class="iconbtn" type="button" data-close="importer" aria-label="Close"><i data-icon="x"></i></button></header>
    <div class="sheet-b" id="impBody"></div>
    <footer class="sheet-f" id="impFoot"></footer>
  </section>
</div>
<div id="toastHost"></div>
</div>
<script src="vendor/supabase.js"></script>
<script src="shim.js"></script>
<script src="app/data.js"></script>
<script src="app/audit.js"></script>
<script src="app/sched.js"></script>
<script src="app/store.js"></script>
<script src="app/app.js"></script>
<script src="app/habits.js"></script>
<script src="app/career.js"></script>
<script src="app/debrief.js"></script>

</body>
</html>
